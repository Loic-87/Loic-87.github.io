[build]
  command = "npm run build"
  publish = "dist"

# Démo Kasa (SPA React compilée dans public/demos/kasa) : ses routes internes
# (/demos/kasa/about, /demos/kasa/logement/:id) doivent renvoyer SON index.html.
# Placée avant la règle générale, car Netlify applique la première règle qui correspond.
[[redirects]]
  from = "/demos/kasa/*"
  to = "/demos/kasa/index.html"
  status = 200

# Anciennes adresses du jeu avant son renommage TRON → Laser Riders (12/11/2026),
# pour que les liens déjà partagés mènent toujours au jeu.
[[redirects]]
  from = "/jeux/tron/*"
  to = "/jeux/laser-riders/:splat"
  status = 301

[[redirects]]
  from = "/projets/tron"
  to = "/projets/laser-riders"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
