[build]
  command = "npm run build"
  publish = "dist"

# Démo Kasa (SPA React compilée dans public/demos/kasa) : ses routes internes
# (/demos/kasa/about, /demos/kasa/logement/:id) doivent renvoyer SON index.html.
# Placée avant la règle générale, car Netlify applique la première règle qui correspond.
[[redirects]]
  from = "/demos/kasa/*"
  to = "/demos/kasa/index.html"
  status = 200

# Chaque jeu a déménagé sur son propre site Netlify et a changé de nom (12-13/11/2026) :
# TRON → Laser Riders → PixelBiker, Neon Defense → Stratigon, Démineur Antivirus → Quarantix.
# Les anciens liens du portfolio mènent toujours au bon endroit.
[[redirects]]
  from = "/jeux/tron/*"
  to = "https://pixelbiker.netlify.app/"
  status = 301

[[redirects]]
  from = "/jeux/laser-riders/*"
  to = "https://pixelbiker.netlify.app/"
  status = 301

[[redirects]]
  from = "/jeux/neon-defense/*"
  to = "https://stratigon.netlify.app/"
  status = 301

[[redirects]]
  from = "/jeux/demineur/*"
  to = "https://quarantix.netlify.app/"
  status = 301

[[redirects]]
  from = "/projets/tron"
  to = "/projets/pixelbiker"
  status = 301

[[redirects]]
  from = "/projets/laser-riders"
  to = "/projets/pixelbiker"
  status = 301

[[redirects]]
  from = "/projets/neon-defense"
  to = "/projets/stratigon"
  status = 301

[[redirects]]
  from = "/projets/demineur-antivirus"
  to = "/projets/quarantix"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
